name: Generate state pages

on:
  push:
    paths:
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate pages
        run: python scripts/generate_state_pages.py --force
      - name: Rebuild sitemap
        run: python scripts/update_sitemap.py
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Generate state pages and rebuild sitemap" || echo "No changes"
          git push
