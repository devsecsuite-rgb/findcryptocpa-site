name: Generate state pages

on:
  push:
    paths:
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate pages and rebuild sitemap
        run: |
          run: python scripts/generate_state_pages.py --force
          python scripts/update_sitemap.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Generate state pages and rebuild sitemap
          file_pattern: "crypto-tax-cpa/** sitemap.xml index.html"
